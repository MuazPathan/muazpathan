<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      
      .pixel-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 16px;
        fill: #FFFFFF;
        text-shadow: 2px 2px 0px #14321A;
      }
      .pixel-label {
        font-family: 'Press Start 2P', monospace;
        font-size: 9px;
        fill: #78E08F;
        letter-spacing: 0.5px;
        text-shadow: 1.5px 1.5px 0px #0F2814;
      }
      .pixel-val {
        font-family: 'Press Start 2P', monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #FFFFFF;
        text-shadow: 2px 2px 0px #0F2814;
      }
      .pixel-rank {
        font-family: 'Press Start 2P', monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #FFEAA7;
        text-shadow: 2px 2px 0px #0F2814;
      }
      
      @keyframes spriteBreathe {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes birdFloat {
        0% { transform: translateX(0px) translateY(0px); }
        50% { transform: translateX(25px) translateY(-4px); }
        100% { transform: translateX(0px) translateY(0px); }
      }
      .idle-sprite { animation: spriteBreathe 2s steps(2, start) infinite; }
      .fly-bird { animation: birdFloat 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ================= PIXEL SKY ================= -->
  <rect width="900" height="280" fill="#68B8A0"/>
  <rect y="35" width="900" height="245" fill="#78C8B0"/>
  <rect y="70" width="900" height="210" fill="#88D8C0"/>

  <!-- Pixel Clouds -->
  <g fill="#A8E8D0" opacity="0.6">
    <rect x="520" y="24" width="280" height="30"/>
    <rect x="550" y="14" width="220" height="48"/>
    <rect x="590" y="6" width="140" height="60"/>
  </g>

  <!-- Distant Birds -->
  <g class="fly-bird" fill="#407868">
    <path d="M480 80 h6 v3 h-6 z M486 83 h6 v3 h-6 z M492 80 h6 v3 h-6 z"/>
    <path d="M540 100 h6 v3 h-6 z M546 103 h6 v3 h-6 z M552 100 h6 v3 h-6 z"/>
  </g>

  <!-- ================= MOUNTAIN RANGES ================= -->
  <!-- Far Gray-Blue Mountains -->
  <polygon points="120,180 240,80 320,130 400,60 520,180" fill="#709890"/>
  <polygon points="210,105 240,80 265,105" fill="#C8E8E0"/> <!-- Snow peak -->
  <polygon points="370,85 400,60 430,85" fill="#C8E8E0"/>   <!-- Snow peak -->

  <!-- Mid Dark Mountains -->
  <polygon points="0,200 80,120 190,200" fill="#507870"/>
  <polygon points="60,140 80,120 100,140" fill="#A8D8D0"/>

  <polygon points="620,200 750,90 890,200" fill="#507870"/>
  <polygon points="720,115 750,90 775,115" fill="#C8E8E0"/>

  <!-- ================= MEADOW & FLOWER FIELD ================= -->
  <!-- Rolling Hills Layer 1 -->
  <ellipse cx="260" cy="250" rx="360" ry="80" fill="#509858"/>
  <ellipse cx="720" cy="250" rx="340" ry="80" fill="#58A060"/>

  <!-- Meadow Base Layer -->
  <rect y="195" width="900" height="85" fill="#60A860"/>
  <rect y="215" width="900" height="65" fill="#509850"/>
  <rect y="240" width="900" height="40" fill="#408840"/>

  <!-- Field Grass Detail Pixels -->
  <g fill="#70B868">
    <rect x="40" y="225" width="6" height="12"/>
    <rect x="46" y="220" width="6" height="18"/>
    <rect x="180" y="235" width="6" height="14"/>
    <rect x="290" y="210" width="6" height="16"/>
    <rect x="360" y="240" width="6" height="16"/>
    <rect x="520" y="230" width="6" height="15"/>
    <rect x="680" y="220" width="6" height="18"/>
    <rect x="820" y="235" width="6" height="14"/>
  </g>

  <!-- Pixel Flowers (White, Yellow, Purple) -->
  <g>
    <!-- White Daisy -->
    <rect x="210" y="240" width="12" height="12" fill="#FFFFFF"/>
    <rect x="213" y="243" width="6" height="6" fill="#F6E58D"/>

    <!-- Yellow Buttercup -->
    <rect x="420" y="245" width="10" height="10" fill="#F9CA24"/>
    <rect x="423" y="247" width="4" height="4" fill="#F0932B"/>

    <!-- Purple Lavender -->
    <rect x="640" y="240" width="12" height="14" fill="#A29BFE"/>
    <rect x="643" y="243" width="6" height="8" fill="#6C5CE7"/>

    <!-- White Daisy 2 -->
    <rect x="740" y="250" width="10" height="10" fill="#FFFFFF"/>
    <rect x="743" y="252" width="4" height="4" fill="#F6E58D"/>
  </g>

  <!-- ================= RETRO PIXEL STATS OVERLAY ================= -->
  <!-- Username Handle -->
  <text x="32" y="44" class="pixel-title">@muazpathan_</text>

  <!-- Metric 1: COMMITS / DEPLOYMENTS -->
  <text x="32" y="80" class="pixel-label">COMMITS (LAST YEAR)</text>
  <text x="32" y="104" class="pixel-val">348+</text>

  <!-- Metric 2: PULL REQUESTS / CLUSTERS -->
  <text x="250" y="80" class="pixel-label">INFRA REPOSITORIES</text>
  <text x="250" y="104" class="pixel-val">24</text>

  <!-- Metric 3: STREAK / UPTIME -->
  <text x="32" y="142" class="pixel-label">UPTIME STREAK</text>
  <text x="32" y="166" class="pixel-val">100% SLA</text>

  <!-- Metric 4: MULTI-CLOUD STARS -->
  <text x="250" y="142" class="pixel-label">CLOUD SYSTEMS</text>
  <text x="250" y="166" class="pixel-val">AWS • AZURE • GCP</text>

  <!-- Metric 5: ARCHITECT RANK -->
  <text x="32" y="202" class="pixel-label">RANK:</text>
  <text x="96" y="202" class="pixel-rank">S+ (ARCHITECT)</text>

  <!-- ================= 16-BIT PIXEL CHARACTER SPRITE ================= -->
  <g class="idle-sprite" transform="translate(680, 95)">
    <!-- Hair & Head -->
    <rect x="18" y="0" width="28" height="12" fill="#18181B"/>
    <rect x="12" y="12" width="40" height="28" fill="#5D4037"/>
    <rect x="14" y="18" width="36" height="22" fill="#8D6E63"/>

    <!-- Glasses Frame -->
    <rect x="18" y="24" width="12" height="10" fill="#FFFFFF"/>
    <rect x="18" y="24" width="12" height="10" stroke="#18181B" stroke-width="2" fill="none"/>
    <rect x="34" y="24" width="12" height="10" fill="#FFFFFF"/>
    <rect x="34" y="24" width="12" height="10" stroke="#18181B" stroke-width="2" fill="none"/>
    <rect x="30" y="27" width="4" height="2" fill="#18181B"/> <!-- Bridge -->

    <!-- Eyes (Behind Glasses) -->
    <rect x="22" y="27" width="4" height="4" fill="#18181B"/>
    <rect x="38" y="27" width="4" height="4" fill="#18181B"/>

    <!-- Beard / Jaw -->
    <rect x="16" y="38" width="32" height="8" fill="#3E2723"/>

    <!-- Black Trench Coat / Body -->
    <rect x="10" y="46" width="44" height="42" fill="#18181B"/>
    <rect x="18" y="46" width="28" height="24" fill="#27272A"/>
    <rect x="28" y="48" width="8" height="12" fill="#FFFFFF"/> <!-- Inner Collar -->
    
    <!-- Hands -->
    <rect x="6" y="66" width="8" height="10" fill="#8D6E63"/>
    <rect x="50" y="66" width="8" height="10" fill="#8D6E63"/>

    <!-- Legs & Boots -->
    <rect x="16" y="88" width="14" height="32" fill="#09090B"/>
    <rect x="34" y="88" width="14" height="32" fill="#09090B"/>
    <rect x="12" y="112" width="18" height="10" fill="#18181B"/>
    <rect x="34" y="112" width="18" height="10" fill="#18181B"/>
  </g>
</svg>
