<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070F"/>
      <stop offset="0.6" stop-color="#071526"/>
      <stop offset="1" stop-color="#0B2236"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3A4A"/>
      <stop offset="0.5" stop-color="#16222E"/>
      <stop offset="1" stop-color="#0B141D"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E6FFEC"/>
      <stop offset="0.3" stop-color="#5CFF8A"/>
      <stop offset="0.7" stop-color="#14A84A"/>
      <stop offset="1" stop-color="#05381A"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39FF7A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#39FF7A" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eye"><circle cx="1060" cy="350" r="96"/></clipPath>
  </defs>
  <style>
    .title{font-family:Impact,'Arial Black','Trebuchet MS',sans-serif;font-weight:900}
    .sub{font-family:'Trebuchet MS',Verdana,sans-serif;font-weight:700}
    .mono{font-family:'Courier New',monospace;font-weight:700}
    .tw{animation:tw 3s ease-in-out infinite}
    .tw2{animation:tw 4.5s ease-in-out infinite .8s}
    .r1{transform-origin:1060px 350px;animation:sp 18s linear infinite}
    .r2{transform-origin:1060px 350px;animation:sp 11s linear infinite reverse}
    .scan{animation:sc 3.2s ease-in-out infinite}
    .blink{animation:bl 2.4s ease-in-out infinite}
    .glow{animation:gl 2.8s ease-in-out infinite}
    .flow{stroke-dasharray:14 22;animation:fl 2.4s linear infinite}
    .f1{animation:f1 5s ease-in-out infinite}
    .f2{animation:f2 6s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes sp{to{transform:rotate(360deg)}}
    @keyframes sc{0%,100%{transform:translateY(-80px)}50%{transform:translateY(80px)}}
    @keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}
    @keyframes gl{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes fl{to{stroke-dashoffset:-72}}
    @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
  </style>

  <!-- night sky -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <g fill="#fff">
    <circle class="tw" cx="90" cy="70" r="2"/><circle class="tw2" cx="220" cy="130" r="1.6"/>
    <circle class="tw" cx="380" cy="60" r="2.2"/><circle class="tw2" cx="520" cy="150" r="1.5"/>
    <circle class="tw" cx="640" cy="80" r="1.8"/><circle class="tw2" cx="150" cy="240" r="1.4"/>
    <circle class="tw" cx="470" cy="260" r="1.6"/><circle class="tw2" cx="720" cy="190" r="2"/>
    <circle class="tw" cx="60" cy="420" r="1.5"/><circle class="tw2" cx="590" cy="30" r="1.4"/>
    <circle class="tw" cx="800" cy="40" r="1.8"/><circle class="tw2" cx="300" cy="200" r="1.3"/>
  </g>
  <!-- moon -->
  <circle cx="1180" cy="90" r="38" fill="#CFE8FF" opacity="0.9"/>
  <circle cx="1196" cy="80" r="34" fill="#06101C"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#39FF7A" stroke-width="2" opacity="0.5">
    <path class="flow" d="M0 600 H180 L230 650 H520 L560 610 H760"/>
    <path class="flow" d="M0 520 H110 L150 560 H330"/>
    <path class="flow" d="M0 660 H90 L120 690 H420"/>
    <path class="flow" d="M520 720 V680 L560 640 H700"/>
  </g>
  <g fill="#39FF7A" opacity="0.8">
    <circle cx="760" cy="610" r="5"/><circle cx="330" cy="560" r="5"/><circle cx="420" cy="690" r="5"/><circle cx="700" cy="640" r="5"/>
  </g>

  <!-- ghost title -->
  <text x="20" y="500" class="title" font-size="330" fill="#39FF7A" opacity="0.05">MUAZ</text>

  <!-- decorative shapes -->
  <g class="f2" fill="none" stroke="#39FF7A" stroke-width="4" opacity="0.8">
    <line x1="30" y1="330" x2="88" y2="388"/><line x1="88" y1="330" x2="30" y2="388"/>
  </g>
  <g class="f1" fill="#39FF7A" opacity="0.9">
    <rect x="236" y="486" width="20" height="5" rx="2"/><rect x="243.5" y="478.5" width="5" height="20" rx="2"/>
  </g>

  <!-- title block -->
  <text x="124" y="460" class="title" font-size="250" fill="#39FF7A" filter="url(#neon)" textLength="500" lengthAdjust="spacingAndGlyphs">MUAZ</text>
  <text x="380" y="506" class="sub" font-size="32" fill="#E6FFEC">The Cloud Architect</text>
  <text x="382" y="548" class="mono" font-size="18" fill="#5CE08A" letter-spacing="3">AWS · AZURE · GCP · FINOPS</text>

  <!-- robot head -->
  <path d="M770 120 C770 60 810 20 880 20 L1280 20 L1280 720 L860 720 C800 640 770 520 770 400Z" fill="url(#metal)" stroke="#3A5166" stroke-width="3"/>
  <!-- panel lines -->
  <g fill="none" stroke="#3A5166" stroke-width="2.5" opacity="0.9">
    <path d="M770 200 H880 L910 170 H1280"/>
    <path d="M790 520 H900 L930 560 H1280"/>
    <path d="M880 20 V110"/>
    <path d="M1000 20 V90"/>
  </g>
  <!-- bolts -->
  <g fill="#5E7A92"><circle cx="800" cy="130" r="6"/><circle cx="800" cy="480" r="6"/><circle cx="1240" cy="60" r="6"/><circle cx="1240" cy="680" r="6"/></g>
  <!-- ear vents -->
  <g stroke="#0A121A" stroke-width="6" stroke-linecap="round">
    <line x1="800" y1="300" x2="850" y2="300"/><line x1="800" y1="322" x2="850" y2="322"/><line x1="800" y1="344" x2="850" y2="344"/><line x1="800" y1="366" x2="850" y2="366"/>
  </g>
  <!-- antenna -->
  <line x1="1180" y1="20" x2="1180" y2="0" stroke="#5E7A92" stroke-width="6"/>
  <circle class="blink" cx="1180" cy="6" r="6" fill="#FF3B5C"/>

  <!-- eye socket -->
  <circle cx="1060" cy="350" r="150" fill="#070D14" stroke="#3A5166" stroke-width="6"/>
  <circle cx="1060" cy="350" r="190" fill="url(#halo)" class="glow"/>
  <g class="r1" fill="none" stroke="#39FF7A" stroke-width="5" stroke-dasharray="60 30" opacity="0.85">
    <circle cx="1060" cy="350" r="128"/>
  </g>
  <g class="r2" fill="none" stroke="#7DFFA8" stroke-width="3" stroke-dasharray="12 14" opacity="0.8">
    <circle cx="1060" cy="350" r="110"/>
  </g>
  <circle cx="1060" cy="350" r="96" fill="url(#iris)"/>
  <g clip-path="url(#eye)">
    <circle cx="1060" cy="350" r="62" fill="none" stroke="#B8FFCB" stroke-width="2" opacity="0.5"/>
    <circle cx="1060" cy="350" r="34" fill="#031A0C"/>
    <circle class="glow" cx="1080" cy="326" r="11" fill="#fff"/>
    <g class="glow" fill="none" stroke="#F2FFF5" stroke-width="3" stroke-linejoin="round">
      <path d="M1000 372 a8 8 0 0 1 3-15 a12 12 0 0 1 23 2 a7 7 0 0 1 1 13Z"/>
      <polygon points="1108,376 1117,381 1117,392 1108,397 1099,392 1099,381"/>
    </g>
    <g class="scan"><rect x="960" y="348" width="200" height="4" fill="#E6FFEC" opacity="0.85"/></g>
  </g>

  <!-- HUD brackets -->
  <g class="blink" fill="none" stroke="#39FF7A" stroke-width="9" stroke-linecap="square">
    <path d="M880 190 V150 H920"/>
    <path d="M1240 560 V600 H1200"/>
    <path d="M1130 676 H1090"/>
  </g>
  <text x="900" y="665" class="mono" font-size="16" fill="#39FF7A" opacity="0.9">SYS:ONLINE // NIGHT_MODE</text>
</svg>
