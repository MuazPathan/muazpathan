name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    name: Render profile-3d-contrib
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): update 3D contribution graph [skip ci]"
            git push
          fi
