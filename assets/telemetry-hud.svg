<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Cyber Border Gradient -->
    <linearGradient id="hud-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="35%" stop-color="#7928CA" />
      <stop offset="70%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <linearGradient id="pill-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.15" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="led-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .label { font-size: 10px; fill: #6E7681; font-weight: 700; letter-spacing: 1.2px; }
    .value { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    .val-cyan { fill: #00F5FF; }
    .val-purple { fill: #C084FC; }
    .val-teal { fill: #00DFD8; }
    .val-green { fill: #4ADE80; }
    .pulse { animation: pulseAnim 2s infinite; }
    @keyframes pulseAnim { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>

  <!-- Outer HUD Frame -->
  <rect x="2" y="2" width="916" height="60" rx="10" fill="url(#hud-bg)" stroke="url(#hud-border)" stroke-width="1.5" filter="url(#neon-glow)" />

  <!-- MODULE 1: SYSTEM CORE -->
  <g transform="translate(25, 0)">
    <rect x="0" y="10" width="195" height="44" rx="6" fill="url(#pill-glow)" stroke="#00F5FF" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="14" y="26" class="mono label">SYS_CORE // 01</text>
    <circle cx="20" cy="40" r="4.5" fill="#00FF9D" filter="url(#led-glow)" class="pulse" />
    <text x="32" y="44" class="mono value val-cyan">STATUS: ONLINE</text>
  </g>

  <!-- MODULE 2: TOPOLOGY -->
  <g transform="translate(245, 0)">
    <rect x="0" y="10" width="205" height="44" rx="6" fill="url(#pill-glow)" stroke="#7928CA" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="14" y="26" class="mono label">TOPOLOGY // 02</text>
    <text x="14" y="44" class="mono value val-purple">⚡ MULTI-CLOUD MESH</text>
  </g>

  <!-- MODULE 3: SECURITY POSTURE -->
  <g transform="translate(475, 0)">
    <rect x="0" y="10" width="205" height="44" rx="6" fill="url(#pill-glow)" stroke="#00DFD8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="14" y="26" class="mono label">SECURITY // 03</text>
    <text x="14" y="44" class="mono value val-teal">🛡️ ZERO-TRUST POSTURE</text>
  </g>

  <!-- MODULE 4: HIGH AVAILABILITY SLA -->
  <g transform="translate(705, 0)">
    <rect x="0" y="10" width="190" height="44" rx="6" fill="url(#pill-glow)" stroke="#00F5FF" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="14" y="26" class="mono label">AVAILABILITY // 04</text>
    <text x="14" y="44" class="mono value val-green">📈 99.999% SLA TARGET</text>
  </g>
</svg>
