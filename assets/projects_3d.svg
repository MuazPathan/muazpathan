<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 440" width="280" height="440">
  <defs>
    <!-- Dark Card Gradient Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Outer Glow -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#80d4ff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#7952ff" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#4120a9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Sphere Gradient -->
    <radialGradient id="sphereCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c4e2ff"/>
      <stop offset="80%" stop-color="#738bff"/>
      <stop offset="100%" stop-color="#42299a"/>
    </radialGradient>

    <!-- Horizontal Light Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00ffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#00ffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes pulseBeam {
      0%, 100% { opacity: 0.5; transform: scaleX(0.85); }
      50% { opacity: 0.95; transform: scaleX(1.15); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes enterPulse {
      0%, 100% { opacity: 0.7; letter-spacing: 2px; }
      50% { opacity: 1; letter-spacing: 3px; }
    }
    .pulsing-glow {
      transform-origin: 140px 150px;
      animation: pulseOrb 3s ease-in-out infinite;
    }
    .pulsing-beam {
      transform-origin: 140px 150px;
      animation: pulseBeam 3s ease-in-out infinite;
    }
    .orbit-ring {
      transform-origin: 140px 150px;
      animation: rotateRing 12s linear infinite;
    }
    .enter-btn {
      animation: enterPulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="276" height="436" rx="14" fill="url(#cardBg)" stroke="#1a2333" stroke-width="1.5"/>

  <!-- Card Header -->
  <g transform="translate(140, 42)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">🧪 Projects</text>
  </g>

  <!-- Horizontal Beam behind orb -->
  <ellipse class="pulsing-beam" cx="140" cy="150" rx="110" ry="2" fill="url(#beamGrad)" />

  <!-- Outer Pulsing Glow Aura -->
  <circle class="pulsing-glow" cx="140" cy="150" r="76" fill="url(#orbGlow)"/>

  <!-- Rotating 3D Orbital Rings -->
  <g class="orbit-ring">
    <ellipse cx="140" cy="150" rx="82" ry="28" fill="none" stroke="#68a5ff" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4, 8"/>
    <ellipse cx="140" cy="150" rx="30" ry="80" fill="none" stroke="#b37eff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3, 7"/>
  </g>

  <!-- Main 3D Sphere Core -->
  <circle cx="140" cy="150" r="34" fill="url(#sphereCore)"/>
  <circle cx="134" cy="144" r="26" fill="#ffffff" opacity="0.95" filter="blur(2px)"/>

  <!-- Section Text -->
  <text x="140" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">PROJECTS</text>
  
  <text x="140" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#7d8b9f" text-anchor="middle" letter-spacing="0.5">systems • experiments • research</text>

  <!-- ENTER Link / Button -->
  <g class="enter-btn">
    <text x="140" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="700" fill="#00e5ff" text-anchor="middle" letter-spacing="2">ENTER →</text>
  </g>

  <!-- Sub-indicator Line -->
  <line x1="80" y1="385" x2="200" y2="385" stroke="#1f2c42" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="385" x2="160" y2="385" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
</svg>
