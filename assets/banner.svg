<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86F59A"/>
      <stop offset="0.55" stop-color="#6BE985"/>
      <stop offset="1" stop-color="#8FF7A2"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9FFD4"/>
      <stop offset="0.45" stop-color="#3FD468"/>
      <stop offset="1" stop-color="#0E5E2A"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4430"/>
      <stop offset="1" stop-color="#4A2E20"/>
    </linearGradient>
    <clipPath id="eyeclip">
      <path d="M890 262 Q1015 185 1150 255 Q1015 325 890 262Z"/>
    </clipPath>
  </defs>
  <style>
    .float1{animation:f1 5s ease-in-out infinite}
    .float2{animation:f2 6s ease-in-out infinite}
    .spin{transform-origin:150px 345px;animation:sp 14s linear infinite}
    .blink{animation:bl 2.4s ease-in-out infinite}
    .glow{animation:gl 3s ease-in-out infinite}
    .title{font-family:Impact,'Arial Black','Trebuchet MS',sans-serif;font-weight:900}
    .sub{font-family:'Trebuchet MS',Verdana,sans-serif;font-weight:700}
    @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
    @keyframes sp{to{transform:rotate(360deg)}}
    @keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes gl{0%,100%{opacity:.55}50%{opacity:1}}
  </style>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- ghost title -->
  <text x="40" y="300" class="title" font-size="260" fill="#ffffff" opacity="0.12">MUAZ</text>

  <!-- floating white shapes -->
  <g class="float1" fill="#fff">
    <rect x="24" y="338" width="64" height="16" rx="3"/>
    <rect x="48" y="314" width="16" height="64" rx="3"/>
  </g>
  <g class="float2" fill="#fff" opacity="0.9">
    <rect x="30" y="192" width="46" height="10" rx="2" transform="rotate(45 53 197)"/>
    <rect x="30" y="192" width="46" height="10" rx="2" transform="rotate(-45 53 197)"/>
  </g>
  <g class="spin" fill="none" stroke="#fff" stroke-width="5" opacity="0.8">
    <line x1="118" y1="313" x2="182" y2="377"/>
    <line x1="182" y1="313" x2="118" y2="377"/>
  </g>
  <g class="float1" fill="#fff" opacity="0.9">
    <rect x="404" y="226" width="22" height="6" rx="2"/>
    <rect x="412" y="218" width="6" height="22" rx="2"/>
  </g>

  <!-- title block -->
  <text x="128" y="148" class="sub" font-size="24" fill="#0B3D17">Muaz Pathan</text>
  <text x="124" y="292" class="title" font-size="190" fill="#0B5D1E" stroke="#0B5D1E" stroke-width="6" stroke-linejoin="round" letter-spacing="2">MUAZ</text>
  <text x="378" y="336" class="sub" font-size="26" fill="#0B3D17">The Cloud Architect</text>
  <text x="378" y="366" class="sub" font-size="15" fill="#146B2B" letter-spacing="3">AWS · AZURE · GCP · FINOPS · DATA</text>

  <!-- character: skin, hair, eye -->
  <path d="M800 420 C790 300 860 215 1000 200 L1200 175 L1200 420Z" fill="url(#skin)"/>
  <path d="M860 70 L1200 0 L1200 195 C1130 140 1060 150 1020 205 C1000 135 940 105 880 150 C900 120 880 95 860 70Z" fill="#0F2E1A"/>
  <path d="M700 0 L930 0 C900 60 850 85 800 130 C820 80 780 40 700 0Z" fill="#14402A"/>
  <path d="M960 0 L1010 0 C990 40 970 70 940 100 C955 60 960 30 960 0Z" fill="#2E7A4D" opacity="0.7"/>
  <path d="M780 160 C760 220 770 290 830 330 C800 270 805 215 830 170Z" fill="#0F2E1A"/>

  <path d="M890 262 Q1015 185 1150 255 Q1015 325 890 262Z" fill="#EFFFEF"/>
  <g clip-path="url(#eyeclip)">
    <circle cx="1030" cy="256" r="62" fill="url(#iris)"/>
    <circle cx="1030" cy="256" r="22" fill="#052B12"/>
    <circle class="glow" cx="1050" cy="238" r="9" fill="#fff"/>
    <!-- reflected tech icons -->
    <g class="glow" fill="none" stroke="#E8FFF0" stroke-width="2.5">
      <path d="M985 266 a10 10 0 0 1 4-19 a14 14 0 0 1 27 2 a9 9 0 0 1 1 17Z" transform="translate(-8 -4)"/>
      <polygon points="1060,262 1070,268 1070,280 1060,286 1050,280 1050,268" transform="translate(4 -2)"/>
      <rect x="1018" y="282" width="12" height="12"/>
      <rect x="1034" y="282" width="12" height="12"/>
    </g>
  </g>
  <path d="M890 262 Q1015 185 1150 255" fill="none" stroke="#0F2E1A" stroke-width="9" stroke-linecap="round"/>
  <path d="M890 262 Q1015 325 1150 255" fill="none" stroke="#2B1A12" stroke-width="3" opacity="0.6"/>

  <!-- HUD brackets -->
  <g class="blink" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="square">
    <path d="M868 150 L868 118 L900 118" transform="translate(0 20)"/>
    <path d="M1175 330 L1175 365 L1140 365"/>
    <path d="M900 372 L868 372 L868 340"/>
  </g>
</svg>
