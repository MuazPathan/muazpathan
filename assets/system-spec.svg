<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1321" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Cyber Border Gradient -->
    <linearGradient id="cyber-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="35%" stop-color="#7928CA" />
      <stop offset="70%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .term-title { font-size: 13px; fill: #8B949E; font-weight: 600; letter-spacing: 0.5px; }
    .status-text { font-size: 11px; fill: #00F5FF; font-weight: 700; letter-spacing: 1px; }
    .ln { font-size: 13px; fill: #384252; text-anchor: end; user-select: none; }
    .comment { fill: #54657E; font-style: italic; }
    .key { fill: #00F5FF; font-weight: 600; }
    .prop { fill: #7AA2F7; }
    .val-str { fill: #9ECE6A; }
    .val-type { fill: #BB9AF7; }
    .val-num { fill: #FF9E64; }
    .bracket { fill: #7DCFFF; }
    .cursor { fill: #00F5FF; animation: blink 1s infinite; }
    .grid-line { stroke: #00F5FF; stroke-opacity: 0.03; stroke-width: 1; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>

  <!-- Outer Cyber Card Container -->
  <rect x="2" y="2" width="916" height="536" rx="14" fill="url(#bg-grad)" stroke="url(#cyber-border)" stroke-width="1.8" filter="url(#neon-glow)" />

  <!-- Background Grid Pattern -->
  <line x1="30" y1="90" x2="890" y2="90" class="grid-line" />
  <line x1="30" y1="160" x2="890" y2="160" class="grid-line" />
  <line x1="30" y1="230" x2="890" y2="230" class="grid-line" />
  <line x1="30" y1="300" x2="890" y2="300" class="grid-line" />
  <line x1="30" y1="370" x2="890" y2="370" class="grid-line" />
  <line x1="30" y1="440" x2="890" y2="440" class="grid-line" />

  <!-- Terminal Window Header Bar -->
  <path d="M 3 16 Q 3 3 16 3 L 904 3 Q 917 3 917 16 L 917 46 L 3 46 Z" fill="url(#header-grad)" />
  <line x1="3" y1="46" x2="917" y2="46" stroke="#21262D" stroke-width="1" />

  <!-- Traffic Lights (macOS / Cyber controls) -->
  <circle cx="25" cy="24" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5" />
  <circle cx="45" cy="24" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5" />
  <circle cx="65" cy="24" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5" />

  <!-- Terminal Title -->
  <g transform="translate(100, 29)">
    <text class="mono term-title">🛰️ MUAZ_PATHAN_OS // CLOUD_ARCHITECT_KERNEL_v4.2</text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <rect x="685" y="14" width="215" height="22" rx="6" fill="url(#badge-grad)" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="700" cy="25" r="4" fill="#00FF9D" filter="url(#soft-glow)" />
  <text x="712" y="29" class="mono status-text">ONLINE // 99.999% SLA</text>

  <!-- Left Line Numbers Bar -->
  <g class="mono ln">
    <text x="45" y="78">01</text>
    <text x="45" y="100">02</text>
    <text x="45" y="122">03</text>
    <text x="45" y="144">04</text>
    <text x="45" y="166">05</text>
    <text x="45" y="188">06</text>
    <text x="45" y="210">07</text>
    <text x="45" y="232">08</text>
    <text x="45" y="254">09</text>
    <text x="45" y="276">10</text>
    <text x="45" y="298">11</text>
    <text x="45" y="320">12</text>
    <text x="45" y="342">13</text>
    <text x="45" y="364">14</text>
    <text x="45" y="386">15</text>
    <text x="45" y="408">16</text>
    <text x="45" y="430">17</text>
    <text x="45" y="452">18</text>
    <text x="45" y="474">19</text>
    <text x="45" y="496">20</text>
  </g>

  <!-- Vertical Divider between Line Numbers and Code -->
  <line x1="58" y1="56" x2="58" y2="515" stroke="#21262D" stroke-width="1" />

  <!-- Code Content Body -->
  <g class="mono" font-size="13.5" transform="translate(75, 0)">
    <!-- Line 1: Header Comment -->
    <text x="0" y="78" class="comment"># ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
    
    <!-- Line 2: Spec Banner -->
    <text x="0" y="100" class="comment"># [SYSTEM_SPEC] :: MULTI_CLOUD_ENTERPRISE_ARCHITECT_PROFILE</text>
    
    <!-- Line 3: apiVersion -->
    <text x="0" y="122">
      <tspan class="key">apiVersion:</tspan> <tspan class="val-type">cloud.muazpathan.dev/v1alpha1</tspan>
    </text>
    
    <!-- Line 4: kind -->
    <text x="0" y="144">
      <tspan class="key">kind:</tspan> <tspan class="val-type">CloudArchitectProfile</tspan>
    </text>
    
    <!-- Line 5: metadata -->
    <text x="0" y="166" class="key">metadata:</text>
    
    <!-- Line 6: identifier -->
    <text x="20" y="188">
      <tspan class="prop">identifier:</tspan> <tspan class="val-str">"Muaz Pathan"</tspan>
    </text>
    
    <!-- Line 7: role -->
    <text x="20" y="210">
      <tspan class="prop">role:</tspan> <tspan class="val-str">"Aspiring Cloud Architect &amp; DevOps Specialist"</tspan>
    </text>
    
    <!-- Line 8: cluster_state -->
    <text x="20" y="232">
      <tspan class="prop">cluster_state:</tspan> <tspan class="val-str">"PRODUCTION_ACTIVE"</tspan>
      <tspan class="comment"># Zero single point of failure</tspan>
    </text>
    
    <!-- Line 9: spec -->
    <text x="0" y="254" class="key">spec:</text>
    
    <!-- Line 10: pillars -->
    <text x="20" y="276" class="prop">architectural_pillars:</text>
    
    <!-- Line 11: multi_cloud -->
    <text x="40" y="298">
      <tspan class="prop">multi_cloud:</tspan> <tspan class="bracket">[</tspan><tspan class="val-str">"AWS"</tspan><tspan class="bracket">, </tspan><tspan class="val-str">"Azure"</tspan><tspan class="bracket">, </tspan><tspan class="val-str">"Google Cloud"</tspan><tspan class="bracket">]</tspan>
    </text>
    
    <!-- Line 12: orchestration -->
    <text x="40" y="320">
      <tspan class="prop">orchestration:</tspan> <tspan class="bracket">[</tspan><tspan class="val-str">"Kubernetes (EKS/AKS)"</tspan><tspan class="bracket">, </tspan><tspan class="val-str">"Docker"</tspan><tspan class="bracket">, </tspan><tspan class="val-str">"Microservices"</tspan><tspan class="bracket">]</tspan>
    </text>
    
    <!-- Line 13: iac -->
    <text x="40" y="342">
      <tspan class="prop">infrastructure_as_code:</tspan> <tspan class="bracket">[</tspan><tspan class="val-str">"Terraform Stacks"</tspan><tspan class="bracket">, </tspan><tspan class="val-str">"GitOps CI/CD"</tspan><tspan class="bracket">]</tspan>
    </text>
    
    <!-- Line 14: frameworks -->
    <text x="40" y="364">
      <tspan class="prop">frameworks:</tspan> <tspan class="bracket">[</tspan><tspan class="val-str">"AWS Well-Architected"</tspan><tspan class="bracket">, </tspan><tspan class="val-str">"Zero-Trust Security Mesh"</tspan><tspan class="bracket">]</tspan>
    </text>
    
    <!-- Line 15: sre_targets -->
    <text x="40" y="386">
      <tspan class="prop">sre_targets:</tspan> <tspan class="bracket">{</tspan> <tspan class="prop">uptime:</tspan> <tspan class="val-num">"99.999%"</tspan><tspan class="bracket">, </tspan><tspan class="prop">rto:</tspan> <tspan class="val-num">"&lt;15m"</tspan><tspan class="bracket">, </tspan><tspan class="prop">rpo:</tspan> <tspan class="val-num">"&lt;5m"</tspan> <tspan class="bracket">}</tspan>
    </text>
    
    <!-- Line 16: engineering_creed -->
    <text x="20" y="408" class="prop">engineering_creed: |</text>
    
    <!-- Line 17: Quote line 1 -->
    <text x="40" y="430" fill="#00DFD8" font-weight="600">"Architect for failure, automate without friction,</text>
    
    <!-- Line 18: Quote line 2 -->
    <text x="40" y="452" fill="#00DFD8" font-weight="600"> and optimize for infinite cloud scale."</text>
    
    <!-- Line 19: Command line execution -->
    <text x="0" y="474">
      <tspan fill="#7928CA" font-weight="700">muaz@cloud-kernel</tspan><tspan fill="#C9D1D9">:</tspan><tspan fill="#00F5FF">~</tspan><tspan fill="#C9D1D9">$</tspan> <tspan fill="#E6EDF3">terraform apply --auto-approve</tspan>
    </text>

    <!-- Line 20: Output -->
    <text x="0" y="496">
      <tspan fill="#27C93F">✔</tspan> <tspan fill="#9ECE6A">Infrastructure deployed: 142 resources active. State locked.</tspan>
      <tspan class="cursor">█</tspan>
    </text>
  </g>

  <!-- Bottom Telemetry Mini Widget -->
  <g transform="translate(620, 420)">
    <rect width="270" height="90" rx="8" fill="#111827" fill-opacity="0.85" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.3" />
    <text x="15" y="24" class="mono" font-size="10" fill="#8B949E" font-weight="700">REALTIME CLUSTER TELEMETRY</text>
    <line x1="15" y1="32" x2="255" y2="32" stroke="#21262D" stroke-width="1" />
    <text x="15" y="50" class="mono" font-size="11" fill="#C9D1D9">⚡ REGION: <tspan fill="#00F5FF">Global Multi-AZ</tspan></text>
    <text x="15" y="68" class="mono" font-size="11" fill="#C9D1D9">🛡️ SEC: <tspan fill="#00FF9D">Zero-Trust / mTLS</tspan></text>
    <text x="145" y="50" class="mono" font-size="11" fill="#C9D1D9">⚙️ IAC: <tspan fill="#BB9AF7">Terraform</tspan></text>
    <text x="145" y="68" class="mono" font-size="11" fill="#C9D1D9">🛰️ K8S: <tspan fill="#FF9E64">Healthy</tspan></text>
  </g>
</svg>
