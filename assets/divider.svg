<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pulse{animation:mv 3.5s linear infinite}
    .dot{animation:bl 1.6s ease-in-out infinite}
    @keyframes mv{from{transform:translateX(-160px)}to{transform:translateX(1200px)}}
    @keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
  </style>
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF7A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39FF7A"/>
      <stop offset="1" stop-color="#39FF7A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 12 H500 L520 4 H680 L700 12 H1200" fill="none" stroke="#1F3A4D" stroke-width="3"/>
  <rect class="pulse" x="0" y="10" width="160" height="4" fill="url(#p)"/>
  <circle class="dot" cx="600" cy="4" r="4" fill="#39FF7A"/>
  <circle cx="12" cy="12" r="4" fill="#5E7A92"/><circle cx="1188" cy="12" r="4" fill="#5E7A92"/>
</svg>
